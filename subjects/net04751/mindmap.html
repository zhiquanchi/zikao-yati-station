.ov-card {

.ov-secs { font-size: 12.5px; color: var(--muted); line-height: 1.8; margin: 0 0 10px; }

.mm-pager a { text-decoration: none; max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.mm-graph-shell { position: relative; }

#mmSvg { width: 100%; height: 100%; display: block; }
#mmSvg text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
#mmSvg .node { cursor: default; }
#mmSvg .node.has-kids { cursor: pointer; }
#mmSvg .node rect { transition: filter .12s; }
#mmSvg .node.has-kids:hover rect { filter: brightness(.97); stroke-width: 2; }
#mmSvg .badge-n { font-size: 11px; fill: #fff; font-weight: 700; }
.mm-graph-tools {
  position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 5;

.mm-graph-tools button {
  width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: #fff;

.mm-graph-tools button:hover { color: var(--accent); border-color: var(--accent); }
.mm-graph-hint {

.mm-ch-head { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
.mm-ch-no {

.mm-ch-head h2 { margin: 0; font-size: 17.5px; flex: 1; min-width: 0; color: color-mix(in srgb, var(--cc) 62%, var(--ink)); }
.mm-ch-n {

.mm-caret {
  flex: none; width: 26px; height: 26px; border: none; background: transparent; color: var(--cc);

.mm-caret:hover { background: color-mix(in srgb, var(--cc) 12%, #fff); }

/* —— 节：彩色编号徽章 + 章色标题 —— */

.mm-sec { margin: 10px 0; }

.mm-ch-tags { display: flex; gap: 4px; flex-wrap: wrap; }

/* —— 考点与子要点 —— */
ul.mm-list { list-style: none; margin: 4px 0 0; padding: 0 0 0 16px; border-left: 2px dotted color-mix(in srgb, var(--cc) 38%, var(--line)); }

.mm-pt { margin: 6px 0; border-radius: 8px; }
.mm-pt:hover { background: color-mix(in srgb, var(--cc) 5%, transparent); }
.mm-pt-row { display: flex; align-items: flex-start; gap: 6px; padding: 2px 6px 2px 0; }
.mm-pt-row .mm-caret { margin-top: 3px; width: 20px; height: 20px; color: color-mix(in srgb, var(--cc) 60%, var(--muted)); }
.mm-pt-row .mm-caret::before { border-left-width: 6px; border-top-width: 4px; border-bottom-width: 4px; }
.mm-pt-row .mm-caret.mm-none { visibility: hidden; cursor: default; }
.mm-pt-dot { flex: none; width: 7px; height: 7px; border-radius: 50%; margin-top: 10px; background: color-mix(in srgb, var(--cc) 55%, transparent); }
.mm-txt { flex: 1; min-width: 0; font-size: 14px; line-height: 1.7; }
.mm-txt b { font-weight: 700; color: color-mix(in srgb, var(--cc) 72%, var(--ink)); }

ul.mm-list ul.mm-list .mm-txt b { color: color-mix(in srgb, var(--cc) 60%, var(--ink)); }
.mm-tags { display: inline-flex; gap: 4px; flex: none; margin-left: auto; }
.mm-tags .badge { cursor: default; }
.badge.comp { background: #f3e8fd; color: #9333ea; }
.mm-empty { text-align: center; color: var(--muted); padding: 40px 0; }
.foot { padding-bottom: calc(30px + env(safe-area-inset-bottom)); }
@media (max-width: 640px) {

  .mm-pt-row { flex-wrap: wrap; }

@media print {

  .mm-chapter { break-inside: avoid; box-shadow: none; }
}

      head.appendChild(h2);
      var n = document.createElement("span");
      n.className = "mm-ch-n";
      n.textContent = (ch.c || []).length + " 节 · " + chPts + " 考点 · 押题 " + (CH_Q[i] || 0) + " 题";
      head.appendChild(n);
      var dist2 = tagDist(ch);
      var dt = document.createElement("span");
      dt.className = "mm-ch-tags";
      ["单选", "填空", "简答", "综合"].forEach(function (name) {
        if (dist2[name]) dt.insertAdjacentHTML("beforeend", '<span class="badge ' + BADGE[name] + '">' + name + " ×" + dist2[name] + "</span>");
      });
      head.appendChild(dt);
      head.addEventListener("click", function (ev) {
        if (ev.target.closest(".mm-caret")) return;
        toggle(cid);
      });
      card.appendChild(head);
      if (chOpen) {
        var box = document.createElement("div");
        box.className = "mm-children";
        (ch.c || []).forEach(function (sec, j) {
          var sid = cid + "s" + j;
          if (filtering() && !matchSub(sec)) return;
          var secOpen = isOpen(sid);
          var div = document.createElement("div");
          div.className = "mm-sec";
          var sh = document.createElement("div");
          sh.className = "mm-sec-head";
          var sc = document.createElement("button");
          sc.type = "button"; sc.className = "mm-caret";
          sc.setAttribute("aria-expanded", secOpen ? "true" : "false");
          sc.setAttribute("aria-label", (secOpen ? "折叠 " : "展开 ") + sec.n);
          sc.addEventListener("click", function (ev) { ev.stopPropagation(); toggle(sid); });
          sh.appendChild(sc);
          var sno = splitNo(sec.n);
          var schip = document.createElement("span");
          schip.className = "mm-sec-no";
          schip.textContent = sno[0];
          sh.appendChild(schip);
          var b = document.createElement("b");
          b.textContent = sno[1];
          sh.appendChild(b);
          var sk = (i + 1) + "." + (j + 1);
          if (SEC_Q[sk]) {
            var qchip = document.createElement("span");
            qchip.className = "mm-sec-q";
            qchip.textContent = "📝 押题 " + SEC_Q[sk] + " 题";
            sh.appendChild(qchip);
          }
          sh.addEventListener("click", function (ev) {
            if (ev.target.closest(".mm-caret")) return;
            toggle(sid);
          });
          div.appendChild(sh);
          if (secOpen) {
            var ul = document.createElement("ul");
            ul.className = "mm-list";
            var pts = 0;
            (sec.c || []).forEach(function (p, k) {
              var pid = sid + "p" + k;
              if (filtering() && !matchSub(p)) return;
              pts++; shown++;
              ul.appendChild(ptNode(p, pid, 2));
            });
            if (pts) div.appendChild(ul);
          }
          box.appendChild(div);
        });
        card.appendChild(box);
      }
      tree.appendChild(card);
    }
    var total = 0;
    (ch.c || []).forEach(function (sec) { (sec.c || []).forEach(function (p) { if (!filtering() || matchSub(p)) total++; }); });
    countEl.textContent = filtering() ? ("本章命中 " + total + " 考点") : ("本章 " + (ch.c || []).reduce(function (a, s) { return a + (s.c || []).length; }, 0) + " 考点");
    // 跨章命中提示
    var jump = crumbsEl.querySelector(".mm-jump");
    if (jump) jump.remove();
    if (filtering()) {
      var best = null;
      MM_DATA.forEach(function (och, oi) {
        if (oi === curCi) return;
        var c = 0;
        (och.c || []).forEach(function (sec) { (sec.c || []).forEach(function (p) { if (matchSub(p)) c++; }); });
        if (c > 0 && (!best || c > best.n)) best = { i: oi, n: c };
      });
      if (best) {
        var a = document.createElement("a");
        a.className = "mm-jump";
        a.href = "#c" + best.i;
        a.textContent = "其他章节还有 " + best.n + " 处命中 →";
        crumbsEl.appendChild(a);
      }
    }
  }

  /* ================= 总览页 ================= */
  function renderOverview() {
    var grid = document.getElementById("ovGrid");
    grid.innerHTML = "";
    MM_DATA.forEach(function (ch, i) {
      var cno = splitNo(ch.n);
      var pts = 0;
      (ch.c || []).forEach(function (sec) { pts += (sec.c || []).length; });
      var secs = (ch.c || []).map(function (s) { return splitNo(s.n)[1]; }).join(" · ");
      var d = tagDist(ch);
      var a = document.createElement("a");
      a.className = "ov-card";
      a.href = "#c" + i;
      a.style.setProperty("--cc", COLORS[i % COLORS.length]);
      var tags = ["单选", "填空", "简答", "综合"].filter(function (t) { return d[t]; })
        .map(function (t) { return '<span class="badge ' + BADGE[t] + '">' + t + " ×" + d[t] + "</span>"; }).join("");
      a.innerHTML = '<span class="ov-no">' + cno[0] + "</span>"
        + "<h2>" + cno[1] + "</h2>"
        + '<div class="ov-stats">' + (ch.c || []).length + " 节 · " + pts + " 考点 · 押题 " + (CH_Q[i] || 0) + " 题</div>"
        + '<p class="ov-secs">' + secs + "</p>"
        + '<div class="ov-tags">' + tags + "</div>";
      grid.appendChild(a);
    });
  }

  /* ================= 章导航 ================= */
  function buildNav() {
    navEl.innerHTML = "";
    var ov = document.createElement("a");
    ov.href = "#";
    ov.className = "mm-navchip";
    ov.textContent = "🏠 总览";
    navEl.appendChild(ov);
    MM_DATA.forEach(function (ch, i) {
      var a = document.createElement("a");
      a.href = "#c" + i;
      a.className = "mm-navchip";
      a.style.setProperty("--cc", COLORS[i % COLORS.length]);
      a.textContent = (i + 1);
      a.setAttribute("aria-label", ch.n);
      navEl.appendChild(a);
    });
  }

  /* ================= 控件 ================= */
  function chapterFullIds(ci) {
    var s = [];
    var ch = MM_DATA[ci], cid = "c" + ci;
    s.push(cid);
    (ch.c || []).forEach(function (sec, j) {
      var sid = cid + "s" + j; s.push(sid);
      (sec.c || []).forEach(function (p, k) {
        var pid = sid + "p" + k; s.push(pid);
        (p.c || []).forEach(function (_, m) { s.push(pid + "d" + m); });
      });
    });
    return s;
  }
  document.getElementById("expandAll").addEventListener("click", function () {
    if (curCi < 0) return;
    chapterFullIds(curCi).forEach(function (id) { exp[id] = true; gexp[id] = true; });
    persist(); renderGraph(); renderList();
  });
  document.getElementById("collapseAll").addEventListener("click", function () {
    if (curCi < 0) return;
    var cid = "c" + curCi;
    chapterFullIds(curCi).forEach(function (id) { delete exp[id]; delete gexp[id]; });
    exp[cid] = true; gexp[cid] = true;
    (MM_DATA[curCi].c || []).forEach(function (_, j) { exp[cid + "s" + j] = true; });
    persist(); renderGraph(); renderList();
  });
  document.getElementById("typeChips").addEventListener("click", function (ev) {
    var btn = ev.target.closest(".chip");
    if (!btn) return;
    typeState = btn.getAttribute("data-type");
    this.querySelectorAll(".chip").forEach(function (c) { c.classList.toggle("active", c === btn); });
    if (curCi >= 0) { renderGraph(); renderList(); }
  });
  var timer = null;
  searchEl.addEventListener("input", function () {
    clearTimeout(timer);
    var v = this.value.trim().toLowerCase();
    timer = setTimeout(function () {
      query = v;
      if (curCi >= 0) { renderGraph(); renderList(); }
    }, 150);
  });

  var tabGraph = document.getElementById("tabGraph"), tabList = document.getElementById("tabList");
  var graphView = document.getElementById("graphView"), listView = document.getElementById("listView");
  function setTab(graph) {
    curTab = graph ? "graph" : "list";
    tabGraph.classList.toggle("active", graph);
    tabList.classList.toggle("active", !graph);
    tabGraph.setAttribute("aria-selected", graph ? "true" : "false");
    tabList.setAttribute("aria-selected", graph ? "false" : "true");
    graphView.hidden = !graph;
    listView.hidden = !!graph;
    if (graph) fitGraph();
  }
  tabGraph.addEventListener("click", function () { setTab(true); });
  tabList.addEventListener("click", function () { setTab(false); });
  window.addEventListener("resize", function () { if (curCi >= 0 && curTab === "graph") renderGraph(); });

  /* ================= 路由与主渲染 ================= */
  function route() {
    var m = (location.hash || "").match(/^#c([0-7])$/);
    return m ? +m[1] : -1;
  }
  function renderAll() {
    var ci = route();
    if (ci === curCi) { if (ci >= 0) { renderGraph(); renderList(); } return; }
    curCi = ci;
    if (ci < 0) {
      overviewApp.hidden = false;
      chapterApp.hidden = true;
      renderOverview();
      window.scrollTo(0, 0);
      return;
    }
    overviewApp.hidden = true;
    chapterApp.hidden = false;
    var ch = MM_DATA[ci];
    var cno = splitNo(ch.n);
    crumbsEl.innerHTML = '<a href="#">🏠 总览</a> › <b style="color:' + COLORS[ci % COLORS.length] + '">' + ch.n + "</b>";
    // 上/下一章
    var prev = document.getElementById("navPrev"), next = document.getElementById("navNext");
    if (ci > 0) { prev.hidden = false; prev.href = "#c" + (ci - 1); prev.textContent = "← " + splitNo(MM_DATA[ci - 1].n)[1]; }
    else prev.hidden = true;
    if (ci < MM_DATA.length - 1) { next.hidden = false; next.href = "#c" + (ci + 1); next.textContent = splitNo(MM_DATA[ci + 1].n)[1] + " →"; }
    else next.hidden = true;
    navEl.querySelectorAll("a").forEach(function (a) {
      a.classList.toggle("on", a.getAttribute("href") === "#c" + ci);
    });
    renderGraph();
    renderList();
    setTab(curTab === "graph");
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", renderAll);

  buildNav();
  renderAll();
})();
</script>
<script src="subject-switch.js"></script>
</body>
</html>
