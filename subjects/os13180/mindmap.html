<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="styles.css">
<style>
/* —— 思维导图页专属样式，基础色板与控件沿用主站 styles.css —— */
.topbar .back {
  display: inline-flex; align-items: center; gap: 5px; color: #fff; text-decoration: none;
  background: rgba(255,255,255,.16); border-radius: 999px; padding: 4px 14px; font-size: 13px; margin-bottom: 10px;
}
.topbar .back:hover { background: rgba(255,255,255,.28); }
.mm-toolbar { top: 10px; }
.mm-toolbar .mm-count { font-size: 12.5px; color: var(--muted); white-space: nowrap; }

/* —— 视图切换 —— */
.mm-tabs { display: flex; gap: 6px; margin: 14px auto 4px; }
.mm-tab {
  border: 1px solid var(--line); background: #fff; color: var(--muted); border-radius: 999px;
  padding: 7px 18px; font-size: 14px; cursor: pointer; transition: .15s;
}
.mm-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

/* —— 总览页 —— */
.ov-intro { font-size: 14px; color: var(--muted); margin: 16px 0 4px; }
.ov-intro b { color: var(--ink); font-weight: 700; }
.ov-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin: 12px 0 8px; }
.ov-card {
  display: block; text-decoration: none; color: inherit; background: var(--card);
  border: 1px solid var(--line); border-top: 4px solid var(--cc); border-radius: 14px;
  padding: 16px 18px; box-shadow: 0 3px 14px rgba(30,40,90,.04); transition: .15s;
}
.ov-card:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(30,40,90,.10); background: color-mix(in srgb, var(--cc) 4%, #fff); }
.ov-card h2 { margin: 8px 0 4px; font-size: 16.5px; color: color-mix(in srgb, var(--cc) 68%, var(--ink)); }
.ov-no {
  display: inline-block; background: color-mix(in srgb, var(--cc) 12%, #fff);
  color: color-mix(in srgb, var(--cc) 85%, var(--ink));
  border: 1px solid color-mix(in srgb, var(--cc) 30%, transparent);
  border-radius: 8px; padding: 2px 10px; font-size: 12.5px; font-weight: 700;
}
.ov-stats { font-size: 12.5px; color: var(--muted); margin: 0 0 8px; }
.ov-secs { font-size: 12.5px; color: var(--muted); line-height: 1.8; margin: 0 0 10px; }
.ov-tags { display: flex; gap: 4px; flex-wrap: wrap; }

/* —— 章导航与面包屑 —— */
.mm-nav { display: flex; gap: 6px; margin: 14px 0 2px; overflow-x: auto; scrollbar-width: none; }
.mm-nav::-webkit-scrollbar { display: none; }
.mm-navchip {
  flex: none; text-decoration: none; font-size: 13px; color: var(--muted);
  background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 5px 13px; transition: .15s;
}
.mm-navchip:hover { color: var(--cc, var(--accent)); border-color: var(--cc, var(--accent)); }
.mm-navchip.on { background: var(--cc); border-color: var(--cc); color: #fff; font-weight: 700; }
.mm-crumbs { font-size: 13px; color: var(--muted); margin: 4px 2px 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.mm-crumbs a { color: var(--accent); text-decoration: none; }
.mm-crumbs .mm-jump { margin-left: auto; font-size: 12.5px; }
.mm-pager { display: flex; justify-content: space-between; gap: 10px; margin: 6px 2px 0; }
.mm-pager a { text-decoration: none; max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* —— 图形视图 —— */
.mm-graph-shell { position: relative; }
#mmGraphWrap {
  height: calc(100vh - 330px); min-height: 440px; margin: 8px 0 4px;
  border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
  background:
    radial-gradient(circle at 18% 12%, rgba(70,83,232,.06), transparent 42%),
    radial-gradient(circle at 84% 80%, rgba(13,148,136,.06), transparent 42%),
    #fbfcff;
  touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none;
}
#mmGraphWrap.grabbing { cursor: grabbing; }
#mmSvg { width: 100%; height: 100%; display: block; }
#mmSvg text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
#mmSvg .node { cursor: default; }
#mmSvg .node.has-kids { cursor: pointer; }
#mmSvg .node rect { transition: filter .12s; }
#mmSvg .node.has-kids:hover rect { filter: brightness(.97); stroke-width: 2; }
#mmSvg .badge-n { font-size: 11px; fill: #fff; font-weight: 700; }
.mm-graph-tools {
  position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 5;
}
.mm-graph-tools button {
  width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: #fff;
  color: var(--ink); font-size: 16px; cursor: pointer; box-shadow: 0 2px 8px rgba(30,40,90,.08); line-height: 1;
}
.mm-graph-tools button:hover { color: var(--accent); border-color: var(--accent); }
.mm-graph-hint {
  position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--muted);
  background: rgba(255,255,255,.85); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; pointer-events: none;
}

/* —— 列表视图：章卡片，每章一条专属色带，头部渐变色底 —— */
.mm-chapter {
  background: linear-gradient(180deg, color-mix(in srgb, var(--cc) 9%, var(--card)) 0, var(--card) 96px);
  border: 1px solid var(--line); border-left: 6px solid var(--cc);
  border-radius: 16px; padding: 16px 20px; margin: 16px 0; box-shadow: 0 4px 16px rgba(30,40,90,.05);
}
.mm-ch-head { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
.mm-ch-no {
  flex: none; background: var(--cc); color: #fff; font-size: 12.5px; font-weight: 700;
  border-radius: 8px; padding: 3px 10px; letter-spacing: 1px;
}
.mm-ch-head h2 { margin: 0; font-size: 17.5px; flex: 1; min-width: 0; color: color-mix(in srgb, var(--cc) 62%, var(--ink)); }
.mm-ch-n {
  font-size: 12px; color: color-mix(in srgb, var(--cc) 72%, var(--ink)); white-space: nowrap;
  background: color-mix(in srgb, var(--cc) 10%, #fff); border: 1px solid color-mix(in srgb, var(--cc) 26%, transparent);
  border-radius: 999px; padding: 2px 10px;
}
.mm-caret {
  flex: none; width: 26px; height: 26px; border: none; background: transparent; color: var(--cc);
  display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer; padding: 0;
}
.mm-caret:hover { background: color-mix(in srgb, var(--cc) 12%, #fff); }
.mm-caret::before { content: ""; border-left: 7px solid currentColor; border-top: 5px solid transparent; border-bottom: 5px solid transparent; transition: transform .15s; }
.mm-caret[aria-expanded="true"] { transform: rotate(90deg); }

/* —— 节：彩色编号徽章 + 章色标题 —— */
.mm-children { margin: 8px 0 0; padding: 0 0 0 14px; border-left: 2px solid color-mix(in srgb, var(--cc) 28%, var(--line)); }
.mm-children[hidden] { display: none; }
.mm-sec { margin: 10px 0; }
.mm-sec-head { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.mm-sec-no {
  flex: none; font-size: 12px; font-weight: 700; border-radius: 6px; padding: 1px 8px;
  color: color-mix(in srgb, var(--cc) 82%, var(--ink));
  background: color-mix(in srgb, var(--cc) 12%, #fff);
  border: 1px solid color-mix(in srgb, var(--cc) 32%, transparent);
}
.mm-sec-head b { font-weight: 700; font-size: 15px; color: color-mix(in srgb, var(--cc) 70%, var(--ink)); }
.mm-sec-head .mm-caret { width: 22px; height: 22px; }
.mm-sec-head .mm-caret::before { border-left-width: 6px; border-top-width: 4px; border-bottom-width: 4px; }
.mm-sec-q {
  flex: none; font-size: 12px; color: var(--muted); background: var(--bg);
  border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; white-space: nowrap;
}
.mm-ch-tags { display: flex; gap: 4px; flex-wrap: wrap; }

/* —— 考点与子要点 —— */
ul.mm-list { list-style: none; margin: 4px 0 0; padding: 0 0 0 16px; border-left: 2px dotted color-mix(in srgb, var(--cc) 38%, var(--line)); }
ul.mm-list[hidden] { display: none; }
.mm-pt { margin: 6px 0; border-radius: 8px; }
.mm-pt:hover { background: color-mix(in srgb, var(--cc) 5%, transparent); }
.mm-pt-row { display: flex; align-items: flex-start; gap: 6px; padding: 2px 6px 2px 0; }
.mm-pt-row .mm-caret { margin-top: 3px; width: 20px; height: 20px; color: color-mix(in srgb, var(--cc) 60%, var(--muted)); }
.mm-pt-row .mm-caret::before { border-left-width: 6px; border-top-width: 4px; border-bottom-width: 4px; }
.mm-pt-row .mm-caret.mm-none { visibility: hidden; cursor: default; }
.mm-pt-dot { flex: none; width: 7px; height: 7px; border-radius: 50%; margin-top: 10px; background: color-mix(in srgb, var(--cc) 55%, transparent); }
.mm-txt { flex: 1; min-width: 0; font-size: 14px; line-height: 1.7; }
.mm-txt b { font-weight: 700; color: color-mix(in srgb, var(--cc) 72%, var(--ink)); }
.mm-txt mark { background: #ffe9a8; color: inherit; border-radius: 3px; padding: 0 1px; }
ul.mm-list ul.mm-list { border-left-style: solid; border-left-width: 1px; border-left-color: color-mix(in srgb, var(--cc) 22%, var(--line)); margin-left: 8px; }
ul.mm-list ul.mm-list .mm-txt { font-size: 13.5px; color: color-mix(in srgb, var(--cc) 18%, var(--ink)); }
ul.mm-list ul.mm-list .mm-txt b { color: color-mix(in srgb, var(--cc) 60%, var(--ink)); }
.mm-tags { display: inline-flex; gap: 4px; flex: none; margin-left: auto; }
.mm-tags .badge { cursor: default; }
.badge.comp { background: #f3e8fd; color: #9333ea; }
.mm-empty { text-align: center; color: var(--muted); padding: 40px 0; }
.foot { padding-bottom: calc(30px + env(safe-area-inset-bottom)); }
@media (max-width: 640px) {
  .ov-grid { grid-template-columns: 1fr; }
  .mm-navchip { padding: 8px 16px; font-size: 14px; }
  .mm-crumbs .mm-jump { margin-left: 0; width: 100%; }
  .mm-toolbar { padding: 10px 12px; }
  .mm-toolbar input[type=search] { flex-basis: 100%; order: 3; font-size: 16px; padding: 10px 12px; }
  .mm-toolbar .mm-count { order: 4; flex-basis: 100%; text-align: right; }
  .mm-toolbar .chips { order: 2; }
  .mm-toolbar button.ghost { order: 1; padding: 9px 14px; font-size: 14px; }
  #mmGraphWrap { height: 62vh; }
  .mm-chapter { padding: 14px 12px; }
  .mm-ch-head { flex-wrap: wrap; }
  .mm-ch-head h2 { font-size: 16px; flex: 1 1 auto; }
  .mm-ch-tags { width: 100%; margin-left: 36px; }
  .mm-sec-q { padding: 2px 10px; }
  .mm-txt { font-size: 14.5px; }
  .mm-tags { margin-left: 26px; width: 100%; }
  .mm-pt-row { flex-wrap: wrap; }
  .mm-tags .badge { padding: 3px 9px; }
}
@media print {
  .mm-toolbar, .mm-caret, .topbar .back, .mm-tabs, .mm-graph-shell { display: none !important; }
  .mm-children, ul.mm-list { display: block !important; }
  .mm-chapter { break-inside: avoid; box-shadow: none; }
}
</style>

    var caret = document.createElement("button");
    caret.type = "button";
    caret.className = "mm-caret" + (kids.length ? "" : " mm-none");
    if (kids.length) {
      caret.setAttribute("aria-expanded", open ? "true" : "false");
      caret.setAttribute("aria-label", (open ? "折叠" : "展开") + " " + plain(node.n));
      caret.addEventListener("click", function (ev) { ev.stopPropagation(); toggle(id); });
    } else { caret.tabIndex = -1; caret.setAttribute("aria-hidden", "true"); }
    row.appendChild(caret);
    if (depth >= 2) {
      var dot = document.createElement("span");
      dot.className = "mm-pt-dot";
      dot.setAttribute("aria-hidden", "true");
      row.appendChild(dot);
    }
    var txt = document.createElement("span");
    txt.className = "mm-txt";
    txt.innerHTML = node.n;
    highlight(txt, query);
    row.appendChild(txt);
    if (node.t) row.insertAdjacentHTML("beforeend", tagsHtml(node.t));
    li.appendChild(row);
    if (kids.length && open) {
      var ul = document.createElement("ul");
      ul.className = "mm-list";
      kids.forEach(function (k, idx) { ul.appendChild(ptNode(k, id + "d" + idx, depth + 1)); });
      li.appendChild(ul);
    }
    return li;
  }

  function renderList() {
    if (curCi < 0) return;
    var ch = MM_DATA[curCi], cid = "c" + curCi, i = curCi;
    tree.innerHTML = "";
    var shown = 0;
    if (filtering() && !matchSub(ch)) {
      tree.innerHTML = '<div class="mm-empty">本章没有匹配的考点' + "</div>";
    } else {
      var chPts = 0;
      (ch.c || []).forEach(function (sec) { (sec.c || []).forEach(function () { chPts++; }); });
      var card = document.createElement("section");
      card.className = "mm-chapter";
      card.style.setProperty("--cc", COLORS[i % COLORS.length]);
      var chOpen = isOpen(cid);
      var head = document.createElement("div");
      head.className = "mm-ch-head";
      var hc = document.createElement("button");
      hc.type = "button"; hc.className = "mm-caret";
      hc.setAttribute("aria-expanded", chOpen ? "true" : "false");
      hc.setAttribute("aria-label", (chOpen ? "折叠 " : "展开 ") + ch.n);
      hc.addEventListener("click", function () { toggle(cid); });
      head.appendChild(hc);
      var cno = splitNo(ch.n);
      var chip = document.createElement("span");
      chip.className = "mm-ch-no";
      chip.textContent = cno[0];
      head.appendChild(chip);
      var h2 = document.createElement("h2");
      h2.textContent = cno[1];
      head.appendChild(h2);
      var n = document.createElement("span");
      n.className = "mm-ch-n";
      n.textContent = (ch.c || []).length + " 节 · " + chPts + " 考点 · 押题 " + (CH_Q[i] || 0) + " 题";
      head.appendChild(n);
      var dist2 = tagDist(ch);
      var dt = document.createElement("span");
      dt.className = "mm-ch-tags";
      ["单选", "填空", "简答", "综合"].forEach(function (name) {
        if (dist2[name]) dt.insertAdjacentHTML("beforeend", '<span class="badge ' + BADGE[name] + '">' + name + " ×" + dist2[name] + "</span>");
      });
      head.appendChild(dt);
      head.addEventListener("click", function (ev) {
        if (ev.target.closest(".mm-caret")) return;
        toggle(cid);
      });
      card.appendChild(head);
      if (chOpen) {
        var box = document.createElement("div");
        box.className = "mm-children";
        (ch.c || []).forEach(function (sec, j) {
          var sid = cid + "s" + j;
          if (filtering() && !matchSub(sec)) return;
          var secOpen = isOpen(sid);
          var div = document.createElement("div");
          div.className = "mm-sec";
          var sh = document.createElement("div");
          sh.className = "mm-sec-head";
          var sc = document.createElement("button");
          sc.type = "button"; sc.className = "mm-caret";
          sc.setAttribute("aria-expanded", secOpen ? "true" : "false");
          sc.setAttribute("aria-label", (secOpen ? "折叠 " : "展开 ") + sec.n);
          sc.addEventListener("click", function (ev) { ev.stopPropagation(); toggle(sid); });
          sh.appendChild(sc);
          var sno = splitNo(sec.n);
          var schip = document.createElement("span");
          schip.className = "mm-sec-no";
          schip.textContent = sno[0];
          sh.appendChild(schip);
          var b = document.createElement("b");
          b.textContent = sno[1];
          sh.appendChild(b);
          var sk = (i + 1) + "." + (j + 1);
          if (SEC_Q[sk]) {
            var qchip = document.createElement("span");
            qchip.className = "mm-sec-q";
            qchip.textContent = "📝 押题 " + SEC_Q[sk] + " 题";
            sh.appendChild(qchip);
          }
          sh.addEventListener("click", function (ev) {
            if (ev.target.closest(".mm-caret")) return;
            toggle(sid);
          });
          div.appendChild(sh);
          if (secOpen) {
            var ul = document.createElement("ul");
            ul.className = "mm-list";
            var pts = 0;
            (sec.c || []).forEach(function (p, k) {
              var pid = sid + "p" + k;
              if (filtering() && !matchSub(p)) return;
              pts++; shown++;
              ul.appendChild(ptNode(p, pid, 2));
            });
            if (pts) div.appendChild(ul);
          }
          box.appendChild(div);
        });
        card.appendChild(box);
      }
      tree.appendChild(card);
    }
    var total = 0;
    (ch.c || []).forEach(function (sec) { (sec.c || []).forEach(function (p) { if (!filtering() || matchSub(p)) total++; }); });
    countEl.textContent = filtering() ? ("本章命中 " + total + " 考点") : ("本章 " + (ch.c || []).reduce(function (a, s) { return a + (s.c || []).length; }, 0) + " 考点");
    // 跨章命中提示
    var jump = crumbsEl.querySelector(".mm-jump");
    if (jump) jump.remove();
    if (filtering()) {
      var best = null;
      MM_DATA.forEach(function (och, oi) {
        if (oi === curCi) return;
        var c = 0;
        (och.c || []).forEach(function (sec) { (sec.c || []).forEach(function (p) { if (matchSub(p)) c++; }); });
        if (c > 0 && (!best || c > best.n)) best = { i: oi, n: c };
      });
      if (best) {
        var a = document.createElement("a");
        a.className = "mm-jump";
        a.href = "#c" + best.i;
        a.textContent = "其他章节还有 " + best.n + " 处命中 →";
        crumbsEl.appendChild(a);
      }
    }
  }

  /* ================= 总览页 ================= */
  function renderOverview() {
    var grid = document.getElementById("ovGrid");
    grid.innerHTML = "";
    MM_DATA.forEach(function (ch, i) {
      var cno = splitNo(ch.n);
      var pts = 0;
      (ch.c || []).forEach(function (sec) { pts += (sec.c || []).length; });
      var secs = (ch.c || []).map(function (s) { return splitNo(s.n)[1]; }).join(" · ");
      var d = tagDist(ch);
      var a = document.createElement("a");
      a.className = "ov-card";
      a.href = "#c" + i;
      a.style.setProperty("--cc", COLORS[i % COLORS.length]);
      var tags = ["单选", "填空", "简答", "综合"].filter(function (t) { return d[t]; })
        .map(function (t) { return '<span class="badge ' + BADGE[t] + '">' + t + " ×" + d[t] + "</span>"; }).join("");
      a.innerHTML = '<span class="ov-no">' + cno[0] + "</span>"
        + "<h2>" + cno[1] + "</h2>"
        + '<div class="ov-stats">' + (ch.c || []).length + " 节 · " + pts + " 考点 · 押题 " + (CH_Q[i] || 0) + " 题</div>"
        + '<p class="ov-secs">' + secs + "</p>"
        + '<div class="ov-tags">' + tags + "</div>";
      grid.appendChild(a);
    });
  }

  /* ================= 章导航 ================= */
  function buildNav() {
    navEl.innerHTML = "";
    var ov = document.createElement("a");
    ov.href = "#";
    ov.className = "mm-navchip";
    ov.textContent = "🏠 总览";
    navEl.appendChild(ov);
    MM_DATA.forEach(function (ch, i) {
      var a = document.createElement("a");
      a.href = "#c" + i;
      a.className = "mm-navchip";
      a.style.setProperty("--cc", COLORS[i % COLORS.length]);
      a.textContent = (i + 1);
      a.setAttribute("aria-label", ch.n);
      navEl.appendChild(a);
    });
  }

  /* ================= 控件 ================= */
  function chapterFullIds(ci) {
    var s = [];
    var ch = MM_DATA[ci], cid = "c" + ci;
    s.push(cid);
    (ch.c || []).forEach(function (sec, j) {
      var sid = cid + "s" + j; s.push(sid);
      (sec.c || []).forEach(function (p, k) {
        var pid = sid + "p" + k; s.push(pid);
        (p.c || []).forEach(function (_, m) { s.push(pid + "d" + m); });
      });
    });
    return s;
  }
  document.getElementById("expandAll").addEventListener("click", function () {
    if (curCi < 0) return;
    chapterFullIds(curCi).forEach(function (id) { exp[id] = true; gexp[id] = true; });
    persist(); renderGraph(); renderList();
  });
  document.getElementById("collapseAll").addEventListener("click", function () {
    if (curCi < 0) return;
    var cid = "c" + curCi;
    chapterFullIds(curCi).forEach(function (id) { delete exp[id]; delete gexp[id]; });
    exp[cid] = true; gexp[cid] = true;
    (MM_DATA[curCi].c || []).forEach(function (_, j) { exp[cid + "s" + j] = true; });
    persist(); renderGraph(); renderList();
  });
  document.getElementById("typeChips").addEventListener("click", function (ev) {
    var btn = ev.target.closest(".chip");
    if (!btn) return;
    typeState = btn.getAttribute("data-type");
    this.querySelectorAll(".chip").forEach(function (c) { c.classList.toggle("active", c === btn); });
    if (curCi >= 0) { renderGraph(); renderList(); }
  });
  var timer = null;
  searchEl.addEventListener("input", function () {
    clearTimeout(timer);
    var v = this.value.trim().toLowerCase();
    timer = setTimeout(function () {
      query = v;
      if (curCi >= 0) { renderGraph(); renderList(); }
    }, 150);
  });

  var tabGraph = document.getElementById("tabGraph"), tabList = document.getElementById("tabList");
  var graphView = document.getElementById("graphView"), listView = document.getElementById("listView");
  function setTab(graph) {
    curTab = graph ? "graph" : "list";
    tabGraph.classList.toggle("active", graph);
    tabList.classList.toggle("active", !graph);
    tabGraph.setAttribute("aria-selected", graph ? "true" : "false");
    tabList.setAttribute("aria-selected", graph ? "false" : "true");
    graphView.hidden = !graph;
    listView.hidden = !!graph;
    if (graph) fitGraph();
  }
  tabGraph.addEventListener("click", function () { setTab(true); });
  tabList.addEventListener("click", function () { setTab(false); });
  window.addEventListener("resize", function () { if (curCi >= 0 && curTab === "graph") renderGraph(); });

  /* ================= 路由与主渲染 ================= */
  function route() {
    var m = (location.hash || "").match(/^#c([0-7])$/);
    return m ? +m[1] : -1;
  }
  function renderAll() {
    var ci = route();
    if (ci === curCi) { if (ci >= 0) { renderGraph(); renderList(); } return; }
    curCi = ci;
    if (ci < 0) {
      overviewApp.hidden = false;
      chapterApp.hidden = true;
      renderOverview();
      window.scrollTo(0, 0);
      return;
    }
    overviewApp.hidden = true;
    chapterApp.hidden = false;
    var ch = MM_DATA[ci];
    var cno = splitNo(ch.n);
    crumbsEl.innerHTML = '<a href="#">🏠 总览</a> › <b style="color:' + COLORS[ci % COLORS.length] + '">' + ch.n + "</b>";
    // 上/下一章
    var prev = document.getElementById("navPrev"), next = document.getElementById("navNext");
    if (ci > 0) { prev.hidden = false; prev.href = "#c" + (ci - 1); prev.textContent = "← " + splitNo(MM_DATA[ci - 1].n)[1]; }
    else prev.hidden = true;
    if (ci < MM_DATA.length - 1) { next.hidden = false; next.href = "#c" + (ci + 1); next.textContent = splitNo(MM_DATA[ci + 1].n)[1] + " →"; }
    else next.hidden = true;
    navEl.querySelectorAll("a").forEach(function (a) {
      a.classList.toggle("on", a.getAttribute("href") === "#c" + ci);
    });
    renderGraph();
    renderList();
    setTab(curTab === "graph");
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", renderAll);

  buildNav();
  renderAll();
})();
</script>
<script src="subject-switch.js"></script>
</body>
</html>
